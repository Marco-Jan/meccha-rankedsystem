# =============================================================================
#  Sicherheitsheader fuer meccha-ranked.com
#
#  Auf den Server nach /etc/nginx/snippets/, dann im vhost innerhalb des
#  server-Blocks fuer Port 443 einbinden:
#
#      include snippets/nginx-sicherheit.conf;
#
#  Danach IMMER erst pruefen, dann neu laden:
#
#      sudo nginx -t && sudo systemctl reload nginx
#
#  `nginx -t` liest die Konfiguration, ohne sie zu uebernehmen. Nur wenn das
#  "syntax is ok" meldet, folgt das reload - sonst reisst ein Tippfehler die
#  Seite ab, und zwar erst beim naechsten Neustart, wenn niemand mehr an die
#  Aenderung denkt.
#
#  Keiner dieser Header aendert etwas an deinen Seiten. Sie sagen dem Browser
#  nur, was er NICHT tun soll.
# =============================================================================


# --- Nur noch verschluesselt -------------------------------------------------
#
# Sagt dem Browser: diese Domain kuenftig ausschliesslich ueber https ansprechen,
# ein Jahr lang. Tippt jemand "meccha-ranked.com" ohne Protokoll, geht der
# Browser gar nicht erst auf http und kann unterwegs nicht umgeleitet werden.
#
# Ohne includeSubDomains und ohne preload - beides ist schwer rueckgaengig zu
# machen. Wer spaeter mal eine Subdomain ohne Zertifikat braucht, waere sonst
# ausgesperrt, und aus der Preload-Liste kommt man nur mit Wartezeit wieder
# heraus. Fuer den Zweck hier reicht die einfache Fassung.
add_header Strict-Transport-Security "max-age=31536000" always;


# --- Keine geratenen Dateitypen ----------------------------------------------
#
# Ohne das raet der Browser den Typ einer Datei anhand ihres Inhalts, wenn ihm
# die Angabe des Servers unplausibel vorkommt. Ein hochgeladenes Bild, in dem
# JavaScript steckt, kann so als Skript ausgefuehrt werden. Da hier Zuschauer
# Bilder hochladen, ist das der wichtigste Header von allen.
add_header X-Content-Type-Options "nosniff" always;


# --- Nicht in fremde Seiten einbetten ----------------------------------------
#
# Verhindert, dass jemand deine Seite unsichtbar in seine eigene einbaut und
# Klicks abfaengt - der Besucher glaubt, er klickt auf X, trifft aber deinen
# Freigeben-Knopf. Heisst Clickjacking.
add_header X-Frame-Options "DENY" always;


# --- Sparsam mit der Herkunft ------------------------------------------------
#
# Der Browser verraet beim Klick auf einen fremden Link normalerweise, von
# welcher Seite man kam - samt Pfad. Bei einer Adresse wie /konto?... waere das
# mehr, als jemanden angeht. So wird nur noch die nackte Domain gemeldet, und
# bei einem Wechsel von https auf http gar nichts.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;


# --- Geraete bleiben aus -----------------------------------------------------
#
# Deine Seiten brauchen weder Kamera noch Mikrofon noch Standort. Was man nicht
# braucht, schaltet man ab - dann kann es auch kein Skript anfordern.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;


# --- Woher Inhalte kommen duerfen --------------------------------------------
#
# Die schaerfste Regel: der Browser laedt nur noch, was von dieser Seite selbst
# kommt. Ein eingeschleustes <script src="fremde-seite.de/..."> laeuft damit
# nicht mehr.
#
#   'unsafe-inline' muss leider bleiben: die Kontoseite bringt ihr Skript und
#   ihre Stile direkt im HTML mit, damit sie ohne zweite Anfrage steht. Das
#   sauber zu loesen hiesse, jedem Block einen Einmal-Schluessel mitzugeben -
#   machbar, aber eine groessere Umbauaktion.
#
#   img-src data: ist noetig, weil Vorschaubilder als Datenblock eingebettet
#   werden. frame-ancestors doppelt X-Frame-Options ab, fuer neuere Browser.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self' https://steamcommunity.com" always;


# --- Version nicht ausplaudern -----------------------------------------------
#
# Steht in jeder Antwort "nginx/1.24.0 (Ubuntu)", muss ein Angreifer nicht mehr
# raten, welche Luecken er probieren kann. Kein Schutz, aber auch kein Grund,
# es ihm zu schenken.
#
# ACHTUNG: server_tokens gehoert NICHT hierher, wenn dieses Snippet innerhalb
# eines server-Blocks eingebunden wird - dort ist es zwar erlaubt, wirkt aber
# nur fuer diese eine Seite. Besser in /etc/nginx/nginx.conf im http-Block,
# dann gilt es fuer alle Seiten auf dem Server, walk-buddy inbegriffen:
#
#     server_tokens off;
